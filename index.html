<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR. BAER</title>
<meta property="og:title" content="MR. BAER">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://www.mrbaer.ch/">
<meta property="og:image" content="https://www.mrbaer.ch/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta property="og:image:alt" content="Illustration of Mr. Baer at a hotel bar">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#faf6ee">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.mrbaer.ch/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23121c25%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Georgia,serif%22 font-size=%2224%22 fill=%22%23c9ab7e%22 text-anchor=%22middle%22 letter-spacing=%221%22%3EMB%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/cormorant-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Cormorant Garamond"; src: url("fonts/cormorant-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Jost"; src: url("fonts/jost-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Jost"; src: url("fonts/jost-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

  :root {
    --paper: #faf6ee;
    --ink: #121c25;
    --brass: #a8875a;
    --brass-light: #c9ab7e;
    --muted: #6d6a64;
    --line: #e4dccd;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
  }
  img { display: block; max-width: 100%; height: auto; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    align-items: center;
    gap: clamp(24px, 5vw, 80px);
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: clamp(32px, 6vh, 72px) clamp(24px, 5vw, 56px) 24px;
  }
  .intro { max-width: 460px; justify-self: end; }
  .label {
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 22px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(42px, 5.6vw, 74px);
    line-height: 1;
    letter-spacing: .06em;
    margin-right: -.06em;
    margin-bottom: 14px;
  }
  .rule { width: 56px; height: 1px; background: var(--brass); }
  .intro { width: max-content; max-width: 100%; } .rule { width: 100%; }
  .lead {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(21px, 2.1vw, 25px);
    line-height: 1.45;
    color: #2b333b;
    margin-bottom: 40px;
  }
  .art { position: relative; }
  .art img {
    width: 100%;
    max-width: 620px;
  }

  footer {
    text-align: center;
    padding: 26px 24px calc(26px + env(safe-area-inset-bottom));
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  footer a:hover, footer a:focus-visible { color: var(--brass); border-color: var(--brass); outline: none; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; gap: 8px; padding-top: 28px; text-align: center; }
    .art { order: -1; }
    .art img { max-width: 440px; margin: 0 auto; }
    .intro { justify-self: center; }
    .rule { margin-left: auto; margin-right: auto; }
    .lead { margin-bottom: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  footer { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  footer a.ig { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; color: var(--brass); border: 1px solid var(--line); border-radius: 50%; transition: color .3s, border-color .3s, background .3s; }
  footer a.ig:hover, footer a.ig:focus-visible { color: var(--paper); background: var(--brass); border-color: var(--brass); outline: none; }

  /* layout refinements */
  .left { justify-self: end; width: max-content; max-width: 100%; }
  .intro { width: auto; } .nm { width: max-content; max-width: 100%; }
  .rule { height: 2px; background: linear-gradient(90deg, #b8935c, #c9a36a 50%, #b8935c); }
  .tag { margin-top: 24px; font-size: 11px; letter-spacing: .34em; margin-right: -.34em; text-transform: uppercase; color: var(--brass); }
  .soc { padding-top: 34px; }
  .soc a.ig { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; color: var(--brass); border: 1px solid var(--line); border-radius: 50%; transition: color .3s, border-color .3s, background .3s; }
  .soc a.ig:hover, .soc a.ig:focus-visible { color: var(--paper); background: var(--brass); border-color: var(--brass); outline: none; }
  @media (max-width: 820px) {
    main { grid-template-areas: "intro" "art" "soc"; align-content: center; row-gap: 0; padding-top: 32px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    .left { display: contents; }
    .intro { grid-area: intro; margin-bottom: 20px; justify-self: center; }
    .nm { margin: 0 auto; }
    .art { grid-area: art; order: 0; }
    .art img { max-width: 400px; }
    .soc { grid-area: soc; justify-self: center; padding-top: 14px; }
    .tag { margin-top: 20px; font-size: 10px; }
    h1 { margin-bottom: 12px; }
  }

  /* entrance + interaction */
  .art { overflow: visible; }
  .glint { position: absolute; left: 51%; top: 43.3%; width: 5.5%; aspect-ratio: 1; transform: translate(-50%,-50%) scale(.3); pointer-events: none; z-index: 2; opacity: 0; animation: glint 8s 4.2s ease-in-out infinite; filter: drop-shadow(0 0 3px rgba(201,163,106,.9)); }
  .glint::before, .glint::after { content: ""; position: absolute; left: 50%; top: 50%; width: 100%; height: 2px; transform: translate(-50%,-50%); background: linear-gradient(90deg, transparent, #fff 45%, #fff 55%, transparent); border-radius: 2px; }
  .glint::after { transform: translate(-50%,-50%) rotate(90deg); }
  @keyframes glint { 0%, 86%, 100% { opacity: 0; transform: translate(-50%,-50%) scale(.3) rotate(0deg); } 92% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(45deg); } }
  h1 .ch { display: inline-block; white-space: pre; }
  .rule { transform-origin: left center; transition: box-shadow .4s; }
  .nm:hover .rule { box-shadow: 0 0 10px rgba(201,163,106,.8); }
  html.anim .art img { opacity: 0; filter: blur(10px); transform: scale(1.025); animation: artIn 1.5s cubic-bezier(.2,.7,.2,1) .05s forwards; }
  html.anim h1 .ch { opacity: 0; transform: translateY(.35em); animation: chIn .9s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(.9s + var(--i) * 90ms); }
  html.anim .rule { transform: scaleX(0); animation: ruleIn 1.1s cubic-bezier(.65,0,.25,1) 1.9s forwards; }
  html.anim .tag { opacity: 0; animation: fadeIn 1s ease 2.6s forwards; }
  html.anim .soc { opacity: 0; transform: translateY(6px); animation: socIn .9s ease 3.1s forwards; }
  html.anim .art img.in { animation: none; opacity: 1; filter: none; transform: none; }
  @keyframes artIn { to { opacity: 1; filter: blur(0); transform: none; } }
  @keyframes chIn { to { opacity: 1; transform: none; } }
  @keyframes ruleIn { to { transform: scaleX(1); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes socIn { to { opacity: 1; transform: none; } }
  @media (max-width: 820px) { .rule { transform-origin: center; } }
  @media (prefers-reduced-motion: reduce) { .glint { display: none; } }
</style>
<script>if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))document.documentElement.classList.add('anim');</script>
</head>
<body>
<main>
  <div class="left">
  <div class="intro">
    <div class="nm"><h1>MR. BAER</h1>
    <div class="rule" aria-hidden="true"></div></div>
    <p class="tag">Gentleman · Host · Bon Vivant</p>
  </div>
  <div class="soc"><a class="ig" href="https://www.instagram.com/mrbaer.ch/" target="_blank" rel="noopener" aria-label="MR. BAER on Instagram"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg></a></div>
  </div>
  <div class="art">
    <span class="glint" aria-hidden="true"></span>
    <img src="images/mr-baer.webp" width="1254" height="1254" alt="Illustration of Mr. Baer leaning against a hotel bar with a martini" fetchpriority="high">
  </div>
</main>


<script>
(function(){
  var h=document.querySelector('h1');if(h&&!h.dataset.split){var t=h.textContent;h.setAttribute('aria-label',t);h.textContent='';
    for(var i=0;i<t.length;i++){var c=document.createElement('span');c.className='ch';c.setAttribute('aria-hidden','true');c.style.setProperty('--i',i);c.textContent=t[i];h.appendChild(c)}h.dataset.split=1}
  var img=document.querySelector('.art img');if(img){img.addEventListener('animationend',function(){img.classList.add('in')});if(!document.documentElement.classList.contains('anim'))img.classList.add('in')}
})();
</script>
</body>
</html>
