<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Baer</title>
<meta name="description" content="Mr. Baer — get in touch.">
<meta property="og:title" content="Mr. Baer">
<meta property="og:description" content="Get in touch.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://www.mrbaer.ch/">
<meta property="og:image" content="https://www.mrbaer.ch/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta property="og:image:alt" content="Illustration of Mr. Baer at a hotel bar">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#faf6ee">
<link rel="canonical" href="https://www.mrbaer.ch/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23121c25%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Georgia,serif%22 font-size=%2221%22 fill=%22%23c9ab7e%22 text-anchor=%22middle%22 letter-spacing=%221%22%3EHXB%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/cormorant-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Cormorant Garamond"; src: url("fonts/cormorant-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Jost"; src: url("fonts/jost-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Jost"; src: url("fonts/jost-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

  :root {
    --paper: #faf6ee;
    --ink: #121c25;
    --brass: #a8875a;
    --brass-light: #c9ab7e;
    --muted: #6d6a64;
    --line: #e4dccd;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Jost", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
  }
  img { display: block; max-width: 100%; height: auto; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    align-items: center;
    gap: clamp(24px, 5vw, 80px);
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: clamp(32px, 6vh, 72px) clamp(24px, 5vw, 56px) 24px;
  }
  .intro { max-width: 460px; justify-self: end; }
  .label {
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 22px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(42px, 5.6vw, 74px);
    line-height: 1;
    letter-spacing: .06em;
    margin-right: -.06em;
    margin-bottom: 26px;
  }
  .rule { width: 56px; height: 1px; background: var(--brass); margin-bottom: 40px; }
  .lead {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(21px, 2.1vw, 25px);
    line-height: 1.45;
    color: #2b333b;
    margin-bottom: 40px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 17px 34px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font: 500 12px/1 var(--sans);
    letter-spacing: .24em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .3s, color .3s, border-color .3s;
  }
  .btn::after { content: ""; width: 18px; height: 1px; background: currentColor; transition: width .3s; }
  .btn:hover, .btn:focus-visible { background: var(--brass); border-color: var(--brass); outline: none; }
  .btn:hover::after, .btn:focus-visible::after { width: 26px; }

  .art { position: relative; }
  .art img {
    width: 100%;
    max-width: 620px;
  }

  footer {
    text-align: center;
    padding: 26px 24px calc(26px + env(safe-area-inset-bottom));
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s; }
  footer a:hover, footer a:focus-visible { color: var(--brass); border-color: var(--brass); outline: none; }

  /* Contact dialog */
  dialog {
    width: min(520px, calc(100% - 32px));
    max-height: calc(100% - 32px);
    margin: auto;
    border: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 30px 80px rgba(18, 28, 37, .28);
  }
  dialog::backdrop { background: rgba(18, 28, 37, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  dialog[open] { animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .dlg { position: relative; padding: 44px 40px 38px; border-top: 3px solid var(--brass); }
  .close {
    position: absolute; top: 14px; right: 14px;
    width: 40px; height: 40px;
    border: 0; background: none; cursor: pointer;
    color: var(--muted);
    font-size: 26px; line-height: 1;
  }
  .close:hover, .close:focus-visible { color: var(--ink); outline: none; }
  .dlg h2 { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.1; margin-bottom: 8px; }
  .dlg .sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    padding: 8px 0 10px;
    font: 400 16px/1.5 var(--sans);
    color: var(--ink);
    border-radius: 0;
    transition: border-color .3s;
  }
  .field textarea { min-height: 110px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-bottom-color: var(--brass); }
  .dlg .btn { width: 100%; justify-content: center; margin-top: 10px; }
  .note { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
  .note a { color: inherit; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; gap: 8px; padding-top: 28px; text-align: center; }
    .art { order: -1; }
    .art img { max-width: 440px; margin: 0 auto; }
    .intro { justify-self: center; }
    .rule { margin-left: auto; margin-right: auto; }
    .lead { margin-bottom: 32px; }
  }
  @media (max-width: 480px) {
    .dlg { padding: 40px 24px 30px; }
    .dlg h2 { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="intro">
    <h1>MR. BAER</h1>
    <div class="rule" aria-hidden="true"></div>
    <button class="btn" type="button" id="open">Get in touch</button>
  </div>
  <div class="art">
    <img src="images/mr-baer.webp" width="1254" height="1254" alt="Illustration of Mr. Baer leaning against a hotel bar with a martini" fetchpriority="high">
  </div>
</main>

<footer>© Mr. Baer</footer>

<dialog id="contact" aria-labelledby="contact-title">
  <div class="dlg">
    <button class="close" type="button" id="close" aria-label="Close">×</button>
    <h2 id="contact-title">Get in touch</h2>
    <p class="sub">Leave a few lines and I’ll get back to you.</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button class="btn" type="submit">Send message</button>
      <p class="note">Opens your email app with the message ready to send.</p>
    </form>
  </div>
</dialog>

<script>
(function () {
  var dlg = document.getElementById("contact");
  var form = document.getElementById("form");
  var to = "hans" + "@" + "mrbaer.ch";

  function open() {
    if (typeof dlg.showModal === "function") { dlg.showModal(); }
    else { location.href = "mailto:" + to; return; }
    setTimeout(function () { document.getElementById("name").focus(); }, 50);
  }
  document.getElementById("open").addEventListener("click", open);
  document.getElementById("close").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var fields = ["name", "email", "message"];
    for (var i = 0; i < fields.length; i++) {
      var el = document.getElementById(fields[i]);
      if (!el.checkValidity() || !el.value.trim()) { el.focus(); el.reportValidity && el.reportValidity(); return; }
    }
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var msg = document.getElementById("message").value.trim();
    var subject = "Enquiry via mrbaer.ch — " + name;
    var body = msg + "\n\n—\n" + name + "\n" + email;
    location.href = "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
    setTimeout(function () { dlg.close(); form.reset(); }, 600);
  });
})();
</script>
</body>
</html>
