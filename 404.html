<style>
  @font-face { font-family: "Cormorant Garamond"; src: url("/fonts/cormorant-400.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Jost"; src: url("/fonts/jost-400.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  :root { --night: #121c25; --ivory: #f5f1e9; --ink: #1d1d1b; --muted: #6f6a61; --brass: #a8875a; --line: rgba(29,29,27,.14); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ivory); color: var(--ink); font-family: "Jost", system-ui, sans-serif; font-size: 16px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  header { background: var(--night); color: var(--ivory); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 26px; padding-bottom: 26px; }
  header a { text-decoration: none; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 28px; }
  main { padding: 90px 0 110px; }
  .label { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--brass); }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: clamp(40px, 6vw, 60px); line-height: 1.05; margin: 16px 0 50px; }
  h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.2; margin: 46px 0 12px; padding-top: 30px; border-top: 1px solid var(--line); }
  h3 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 26px 0 6px; font-weight: 400; }
  p, li { font-size: 15.5px; color: #3d3b36; }
  p + p { margin-top: 12px; }
  footer { background: var(--night); color: rgba(245,241,233,.5); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
  footer .wrap { padding-top: 30px; padding-bottom: 36px; }
  .nf { min-height: calc(100vh - 160px); display: flex; align-items: center; text-align: center; padding: 80px 0; }
  .nf .wrap { width: 100%; }
  .nf h1 { margin: 16px 0 20px; }
  .nf p { max-width: 440px; margin: 0 auto 40px; }
  .btn { display: inline-block; padding: 15px 32px; border: 1px solid var(--brass); color: var(--ink); text-decoration: none; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; transition: background .3s, color .3s; }
  .btn:hover, .btn:focus-visible { background: var(--brass); color: var(--ivory); }
